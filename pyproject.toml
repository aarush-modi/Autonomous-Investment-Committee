[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-investment-committee"
version = "0.1.0"
description = "Multi-agent system that simulates a professional investment board. Specialized AI agents collaborate to ingest market data, analyze investments, and produce structured research reports with Buy/Sell/Hold recommendations."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    # Core
    "anthropic>=0.84.0,<1",
    "pydantic>=2.12.5,<3",
    "python-dotenv>=1.2.2,<2",
    "httpx>=0.28.1,<1",
    "Jinja2>=3.1.6,<4",
    # Data providers
    "yfinance>=1.2.0,<2",
    "fredapi>=0.5.2,<1",
    "edgartools>=5.25.1,<6",
    # RAG
    "chromadb>=1.5.5,<2",
    "sentence-transformers>=5.3.0,<6",
    # Analysis
    "pandas>=3.0.1,<4",
    "numpy>=2.4.3,<3",
    "scipy>=1.17.1,<2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises real local ML/vector-store stack (downloads sentence-transformers weights on first run); excluded via `pytest -m \"not integration\"`",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["src*", "config*"]
